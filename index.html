<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Future Quest 2026 - Online Puzzle Competition hosted by Jain University, School of Future Technology for 11th and 12th grade school teams.">
  <title>Future Quest 2026 | Jain University SFT</title>

  <!-- Google Fonts: IBM Plex Sans and IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Global Notification Banner Container -->
  <div id="notice-banner-root" class="notice-banner-root" aria-live="assertive"></div>

  <!-- Sticky App Navigation Bar -->
  <div id="app-navbar" class="nav-container"></div>

  <!-- Main SPA Viewport -->
  <main id="app-main" class="app-main" role="main" tabindex="-1">
    <div class="loading-state">Initializing Future Quest contest terminal...</div>
  </main>

  <!-- Accessible Modal Root Container -->
  <div id="modal-root" class="modal-root" aria-live="polite"></div>

  <!-- Application Bootstrap -->
  <script type="module" src="js/app.js"></script>

</html>
